<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Single-line meta tags throughout this head: line-based crawlers/scrapers (and audit
         tools) miss multi-line attributes, and these tags are exactly what they read. -->

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <!-- The monoline still mark (assets/logo.svg is the canonical copy; public/favicon.svg is served). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://onestillpoint.app/" />
    <title>One Still Point</title>
    <meta name="description" content="A scientifically accurate black hole in your browser: real-time gravitational lensing, a glowing accretion disk, orbiting stars and planets, tidal spaghettification, black-hole mergers, and a spiral-galaxy mode. Free and GPU-accelerated." />
    <!-- Share cards (public/og.png is generated from the mark — npm run generate:share). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="One Still Point" />
    <meta property="og:title" content="One Still Point" />
    <meta property="og:description" content="A scientifically accurate black hole in your browser: real-time gravitational lensing, a glowing accretion disk, orbiting stars and planets, tidal spaghettification, black-hole mergers, and a spiral-galaxy mode. Free and GPU-accelerated." />
    <meta property="og:url" content="https://onestillpoint.app/" />
    <meta property="og:image" content="https://onestillpoint.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The One Still Point monoline black-hole mark beside the wordmark." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="One Still Point" />
    <meta name="twitter:description" content="A scientifically accurate black hole in your browser: real-time gravitational lensing, a glowing accretion disk, orbiting stars and planets, tidal spaghettification, black-hole mergers, and a spiral-galaxy mode. Free and GPU-accelerated." />
    <meta name="twitter:image" content="https://onestillpoint.app/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "One Still Point",
        "url": "https://onestillpoint.app/",
        "description": "A scientifically accurate black hole in your browser: real-time gravitational lensing, a glowing accretion disk, orbiting stars and planets, tidal spaghettification, black-hole mergers, and a spiral-galaxy mode. Free and GPU-accelerated.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (WebGPU- or WebGL2-capable browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Chris Portka", "url": "https://github.com/cportka" }
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- The intro's own stylesheet (moment of creation + splash + Replay melt), a
         self-contained unit alongside src/intro/overlay.html — see src/intro/README.md. -->
    <link rel="stylesheet" href="/src/intro/intro.css" />
  </head>
  <body>
    <!-- The page's one heading — visually hidden (the canvas is the interface), present for
         assistive tech + document structure. data-nosnippet keeps Google from stitching it (and the
         noscript fallback below) into the search snippet in place of the meta description — the
         observed live snippet was exactly this heading + the noscript + the HUD's fps readout. -->
    <h1 data-nosnippet style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); margin: 0">
      One Still Point — an animated black hole visualizer
    </h1>
    <noscript>
      <div data-nosnippet>One Still Point requires JavaScript and a WebGPU- or WebGL2-capable browser.</div>
    </noscript>
    <!-- The instant-paint intro (black hold → test pattern → "moment of creation" →
         binary-merger splash, all sequenced by the inline window.__ospIntro). It lives
         in one place — src/intro/overlay.html — and the introOverlay() plugin in
         vite.config.ts inlines it here. Edit the overlay there. -->
    <!-- @osp-intro-overlay -->
    <!-- Boot-failure escape hatch (shown only if the engine module can't load — see the
         __ospBoot catch below). Inline-styled so it stands even if /src/style.css is itself
         a stale asset, and z-indexed above the looping splash so the user sees THIS, not an
         endless intro. -->
    <div id="osp-bootfail" hidden style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#05060a;color:#c9c6be;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:center;padding:24px">
      <div style="max-width:340px">One Still Point couldn't finish loading — usually a new version just shipped. A reload should set it right.</div>
      <button type="button" onclick="window.__ospReload ? window.__ospReload(true) : location.reload()" style="padding:10px 20px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(255,255,255,.06);color:#fff;font:inherit;letter-spacing:.06em;cursor:pointer">Reload</button>
    </div>
    <!-- Defer the heavy engine bundle. Rather than a static `<script src>` that parses
         + executes the moment the HTML is done — starving the cheap CSS prelude's
         timers and the splash's first paint, which reordered the beats and opened a
         black gap before the merger — expose it as a dynamic import and let the inline
         splash call window.__ospBoot() once it's built + covering. The ~860KB parse +
         WebGPU compile then happen *under* the splash. (Vite code-splits main.ts into
         its own chunk and resolves this path in the build.) -->
    <script type="module">
      // A CACHE-BUSTING reload: navigate to a fresh URL (a new ?_r= makes it a cache MISS) so a
      // sticky iOS-Safari HTML cache can't just re-serve the same stale index.html — which is why
      // a plain location.reload() failed to recover on device (the v0.99.1 fix looped back to the
      // Reload prompt). Preserves any existing query (?worker, ?firstlight, …); replace() so it
      // doesn't stack history. clearGuard=true (the manual button) grants a fresh single retry.
      // A CACHE-BUSTING reload: navigate to a fresh URL (a new ?_r= makes it a cache MISS) so a
      // sticky iOS-Safari HTML cache can't just re-serve the same stale index.html. Preserves any
      // existing query (?worker, ?firstlight, …); replace() so it doesn't stack history.
      window.__ospReload = function (clearGuard) {
        if (clearGuard) { try { sessionStorage.removeItem('osp-boot-retry'); } catch (e) {} }
        try {
          var u = new URL(location.href);
          u.searchParams.set('_r', String(Date.now()));
          location.replace(u.href);
        } catch (e) {
          location.reload();
        }
      };
      // The engine bundle sets window.__ospAlive the instant it evaluates (see main.ts). EVERY
      // recovery path is gated on it, so nothing here can ever act against a running app — the
      // failsafe was covering a healthy reveal on Firefox (the app logged "reveal … complete: true"
      // while this card sat on top). If it's alive, we are done, full stop.
      function ospRecover() {
        if (window.__ospAlive) return;
        // A stale index (a cached page pointing at a hashed chunk a newer deploy purged → the host
        // serves index.html for the missing .js → a MIME error) is fixed by fetching a fresh index.
        // Cache-bust reload ONCE; a sessionStorage guard stops a genuinely broken deploy from
        // looping, and the second miss surfaces the manual Reload card.
        try {
          if (!sessionStorage.getItem('osp-boot-retry')) {
            sessionStorage.setItem('osp-boot-retry', '1');
            window.__ospReload(false);
            return;
          }
        } catch (e) { /* storage blocked — fall through to the card */ }
        var el = document.getElementById('osp-bootfail');
        if (el && !window.__ospAlive) el.hidden = false;
      }
      window.__ospBoot = function () {
        // WATCHDOG, not a bare import().catch: the true signal of a bad boot is that the app never
        // becomes alive. If __ospAlive isn't set within the window, THEN recover. A genuine
        // module-load failure rejects fast (handled below); this only covers a hang. Because it
        // checks __ospAlive, a slow-but-successful reveal can never trip it — the false-positive
        // the old import().catch could produce is gone.
        var watchdog = window.setTimeout(ospRecover, 30000);
        return import('/src/main.ts')
          .then(function (m) {
            window.clearTimeout(watchdog);
            window.__ospAlive = true;
            var el = document.getElementById('osp-bootfail'); if (el) el.hidden = true;
            try { sessionStorage.removeItem('osp-boot-retry'); } catch (e) {}
            // Strip the cache-bust param so the address bar stays clean after a recovery.
            try {
              var u = new URL(location.href);
              if (u.searchParams.has('_r')) {
                u.searchParams.delete('_r');
                history.replaceState(null, '', u.pathname + (u.searchParams.toString() ? '?' + u.searchParams.toString() : '') + u.hash);
              }
            } catch (e) {}
            return m;
          })
          .catch(function (err) {
            window.clearTimeout(watchdog);
            ospRecover(); // no-op if the app is alive; else cache-bust reload once, then the card
            throw err;
          });
      };
    </script>
  </body>
</html>
