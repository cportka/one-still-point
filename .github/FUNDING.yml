# Shows a "Sponsor" button on the repo. Mirrors the About modal's Donate row (src/ui/about.ts):
# Buy Me a Coffee, Venmo, BTC, ETH. GitHub renders the platform keys (github / buy_me_a_coffee)
# as first-class buttons; `custom:` takes URLs, so the two crypto addresses link to their block
# explorers (the address is front-and-centre on both pages; the in-app chips copy it directly).
github: [cportka]
buy_me_a_coffee: chrisportka
custom:
  - https://venmo.com/portka # Venmo — same link as the About modal's "Venmo ↗" chip
  - https://mempool.space/address/3J4XRAwhHwJWQb4F4qw5yTCrs5Zg1s1vaR # $BTC — the About modal's copy-chip address
  - https://etherscan.io/address/0x354c2aB3f7a23F74cdDC745B26aEA53EC1602203 # $ETH — the About modal's copy-chip address
